<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cek Status - Aspirasi MPK</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ee;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 8%;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #8b4b3a;
        }

        .school {
            margin-top: 4px;
            color: #777;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #8b4b3a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #hasilStatus {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #f8f1ed;
            line-height: 1.6;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #8b4b3a;
            text-decoration: none;
            font-weight: bold;
        }

        .kode {
            font-weight: bold;
            color: #8b4b3a;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        ASPIRASI MPK
    </div>

    <div class="school">
        MAN 5 JAKARTA
    </div>

</header>

<div class="container">

    <a href="index.html" class="back">
        ← Kembali ke Beranda
    </a>

    <div class="card">

        <h1>Cek Status Aspirasi</h1>

        <p>
            Masukkan kode aspirasi yang kamu dapat setelah mengirim aspirasi.
        </p>

        <input
            type="text"
            id="kodeAspirasi"
            placeholder="Contoh: ASP-2026-9926"
        >

        <button id="tombolCek">
            Cek Status
        </button>

        <div id="hasilStatus"></div>

    </div>

</div>

<script>

    document
        .getElementById("tombolCek")
        .addEventListener("click", function() {

            const kode =
                document
                .getElementById("kodeAspirasi")
                .value
                .trim();

            const hasil =
                document.getElementById("hasilStatus");


            if (kode === "") {

                hasil.textContent =
                    "Masukkan kode aspirasi terlebih dahulu.";

                return;
            }


            // Mengambil data aspirasi
            const daftarAspirasi =
                JSON.parse(
                    localStorage.getItem("daftarAspirasi")
                ) || [];


            // Mencari kode yang dimasukkan
            const aspirasi =
                daftarAspirasi.find(
                    item =>
                        item.kode.toLowerCase() ===
                        kode.toLowerCase()
                );


            // Kalau kode tidak ditemukan
            if (!aspirasi) {

                hasil.innerHTML =
                    "❌ Kode aspirasi tidak ditemukan.<br>" +
                    "Pastikan kode yang kamu masukkan benar.";

                return;
            }


            // Kalau kode ditemukan
            hasil.innerHTML =

                "✅ <strong>Aspirasi ditemukan!</strong><br><br>" +

                "Kode: " +
                "<span class='kode'>" +
                aspirasi.kode +
                "</span><br>" +

                "Kategori: " +
                aspirasi.kategori +
                "<br>" +

                "Status: " +
                "<strong>" +
                aspirasi.status +
                "</strong>";

        });

</script>

</body>
</html>
